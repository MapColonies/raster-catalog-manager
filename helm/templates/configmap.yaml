{{- $chartName := include "raster-catalog-manager.name" . -}}
{{- $configmapName := include "configmap.fullname" . }}
{{- $server := .Values.server -}}
{{- $telemetry := .Values.telemetry -}}
{{- $tracingUrl := include "raster-catalog-manager.tracingUrl" . -}}
{{- $opentelemetryLoggingUrl := include "raster-catalog-manager.opentelemetryLoggingUrl" . -}}
{{- $db := (include "common.db.merged" .) | fromYaml }}
{{- if .Values.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $configmapName }}
data:
  {{- with $server }}
  REQUEST_PAYLOAD_LIMIT: {{ .requestPayloadLimit | quote }}
  RESPONSE_COMPRESSION_ENABLED: {{ .responseCompressionEnabled | quote }}
  {{- end }}
  {{- with $telemetry }}
  LOG_LEVEL: {{ .logger.level | quote }}
  LOG_PRETTY_PRINT_ENABLED: {{ .logger.prettyPrint | quote }}
  {{- with .logger.opentelemetryOptions }}
  OPENTELEMETRY_LOGGING_ENABLED: {{ .enabled | quote }}
  {{- if .enabled }}
  OTLP_LOGGER_ENDPOINT_URL: {{ $opentelemetryLoggingUrl | quote }}
  {{- if .resourceAttributes }}
  OTEL_RESOURCE_ATTRIBUTES: {{ include "raster-catalog-manager.otelResourceAttributes" .resourceAttributes | quote }}
  OPENTELEMETRY_RESOURCE_ATTRIBUTES: {{ .resourceAttributes | toJson | quote }}
  {{- end }}
  {{- end }}
  {{- end }}
  TELEMETRY_TRACING_ENABLED: {{ .tracing.enabled | quote }}
  {{- if .tracing.enabled }}
  TELEMETRY_TRACING_URL: {{ $tracingUrl | quote }}
  {{- end }}
  {{- end }}
  DB_HOST: {{ $db.host }}
  DB_PORT:  {{ $db.port | quote }}
  DB_NAME: {{ $db.name }}
  DB_SSL_ENABLE: {{ $db.sslEnabled | quote }}
  DB_SSL_CA: {{ .Values.db.sslMountPath }}/{{ .Values.db.caFile }}
  DB_SSL_KEY: {{ .Values.db.sslMountPath }}/{{ .Values.db.caKey }}
  DB_SSL_CERT: {{ .Values.db.sslMountPath }}/{{ .Values.db.certFile }}
  DB_SCHEMA: {{ $db.schema }}
  DB_LOGGING: {{ $db.logging | quote }}
  PGAPPNAME: {{ $chartName }}
  {{- with .Values.configManagement }}
  CONFIG_NAME: {{ .name | quote }}
  CONFIG_VERSION: {{ .version | quote }}
  CONFIG_OFFLINE_MODE: {{ .offlineMode | quote }}
  CONFIG_SERVER_URL: {{ .serverUrl | quote }}
  {{- end -}}
{{- end }}
